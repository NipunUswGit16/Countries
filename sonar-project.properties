
# CI merges coverage-unit.out and coverage-functional.out into coverage.out (repo root and per-module).
# Local targets (e.g. make test-debug, test-module) may still emit cover.out.
sonar.go.coverage.reportPaths=coverage.out,**/coverage.out,cover.out,**/cover.out

# Exclude directories and CI/build config files from analysis.
# The CI/build files (pipeline YAML, Dockerfiles, Makefiles, IFS CI manifests)
# have no Go test coverage and would otherwise drag down "Coverage on New Code"
# for changes that only touch the build pipeline (e.g. Trivy version bumps).
sonar.exclusions=**/web/**,**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,bitbucket-pipelines.yml,**/Dockerfile,Makefile,**/Makefile,**/*.mk,.ifsci/**

# Exclude test files from test coverage.
# The four template stub files (routes.go, handlers.go, and the two app_config.go files)
# are scaffolding placeholders meant to be filled in by downstream components. Until they
# contain real logic there is nothing meaningful to cover; once a consumer adds logic it
# will be exercised by that consumer's own tests.
sonar.coverage.exclusions=**/*_test.go,renovate.config.js,**/godogs/**/*.go,local-dev/**/*.go,**/*_mock.go,**/mocks/**/*.go,**/loadtest/**/*.go,**/web/**/*,**/internal/api/routes.go,**/internal/event-handler/handlers.go,**/internal/api/config/app_config.go,**/internal/event-handler/config/app_config.go,**/cmd/client-api/*.go,**/cmd/event-handler/*.go

# Ignore code duplication in test and mock files
sonar.cpd.exclusions=**/*_test.go,**/*_mock.go,**/mocks/**/*.go,**/web/**/*

sonar.issue.ignore.multicriteria=r1,r2,r3,r4,r5,r6,r7,r8,r9

# disable the identical implementation rule for mock files
sonar.issue.ignore.multicriteria.r1.ruleKey=go:S4144
sonar.issue.ignore.multicriteria.r1.resourceKey=**/*_mock.go

# disable the identical implementation rule for test files
sonar.issue.ignore.multicriteria.r2.ruleKey=go:S4144
sonar.issue.ignore.multicriteria.r2.resourceKey=**/*_test.go

# disable the identical implementation rule for mock files
sonar.issue.ignore.multicriteria.r3.ruleKey=go:S4144
sonar.issue.ignore.multicriteria.r3.resourceKey=**/mocks/**/*.go

# disable the string literalss duplication rule for test files
sonar.issue.ignore.multicriteria.r4.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.r4.resourceKey=**/*_test.go

# disable the cognitive complexity rule for test files
sonar.issue.ignore.multicriteria.r5.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.r5.resourceKey=**/*_test.go

# disable Get prefix check
sonar.issue.ignore.multicriteria.r6.ruleKey=godre:S8179
sonar.issue.ignore.multicriteria.r6.resourceKey=**/*.go

# disable group parameters of same type
sonar.issue.ignore.multicriteria.r7.ruleKey=godre:S8209
sonar.issue.ignore.multicriteria.r7.resourceKey=**/*.go

# ignore unchecked errors in test files
sonar.issue.ignore.multicriteria.r8.ruleKey=godre:S8148
sonar.issue.ignore.multicriteria.r8.resourceKey=**/*_test.go

# ignore haveing tag and digest in dockerfile
sonar.issue.ignore.multicriteria.r9.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.r9.resourceKey=**/Dockerfile