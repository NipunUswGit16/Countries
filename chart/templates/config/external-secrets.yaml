{{/*
ExternalSecrets
Helpers: kairos.externalSecret.postgres, kairos.externalSecret.kafka
Location: kairos-component-common/charts/kairos-components-common/templates/_externalsecret.tpl
Config: postgres, kafka
Requires: External Secrets Operator
*/}}
{{ include "kairos.externalSecret.postgres" (dict "Values" .Values.postgres "Root" .) }}
---
{{ include "kairos.externalSecret.kafka" (dict "Values" .Values.kafka "Root" .) }}
---
{{- if eq ((index .Values "client-api").authGateway.sessionStorageType | default "memory") "redis" }}
{{ include "kairos.externalSecret.authGatewayRedis" (dict "Values" (index .Values "client-api").authGateway.redis "Root" .) }}
{{- end }}
