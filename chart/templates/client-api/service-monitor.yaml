{{/*
ServiceMonitor: client-api
Helper: kairos.serviceMonitor
Location: kairos-component-common/charts/kairos-components-common/templates/_servicemonitor.tpl
Config: defaults.serviceMonitor.* (values.yaml)
Requires: Prometheus Operator CRD
*/}}
{{- $appConfig := include "bundle.getAppConfig" (dict "root" . "app" "client-api") | fromYaml }}
{{- if and (ne ((default dict $appConfig.serviceMonitor).enabled | toString) "false") (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{ include "kairos.serviceMonitor" (dict "name" (printf "%s-client-api" .Release.Namespace) "appLabel" "client-api" "port" "metrics" "Values" $appConfig "Capabilities" .Capabilities "Root" .) }}
{{- end }}
