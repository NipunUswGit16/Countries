{{- if .Values.debezium.enabled }}
{{- $dz := .Values.debezium }}
{{- $dbSecret := $dz.dbSecret | default dict }}
{{/* Local k3d has no Key Vault. Kyverno generate-debezium-db-secret creates
     Secret/<component>-db; do not emit ExternalSecret. `default` would coerce
     an explicit false, so read the key directly. */}}
{{- $emitDbSecret := true }}
{{- if hasKey $dbSecret "enabled" }}
  {{- $emitDbSecret = $dbSecret.enabled }}
{{- end }}
{{- if $emitDbSecret }}
{{- $component := $dz.componentName | default .Chart.Name }}
{{- $platformNs := $dz.platformNamespace | default "kairos-kafka-connect" }}
{{- $pg := .Values.postgres }}
{{- if not (and $pg.usernameSecretName $pg.passwordSecretName) }}
{{- fail "debezium.dbSecret.enabled requires postgres.usernameSecretName and postgres.passwordSecretName (Key Vault keys used to sync Secret/<component>-db into the platform namespace). For local k3d set debezium.dbSecret.enabled: false so Kyverno generate-debezium-db-secret owns the secret." }}
{{- end }}
{{- $decoding := $dbSecret.decodingStrategy | default "None" }}
{{- $storeName := $dbSecret.storeName | default ($pg.secretStore | default "default") }}
{{- $refresh := $dbSecret.refreshInterval | default "15m" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-db" $component | quote }}
  namespace: {{ $platformNs }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    debezium.kairos.dev/component: {{ $component | quote }}
    debezium.kairos.dev/source-namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $refresh | quote }}
  secretStoreRef:
    name: {{ $storeName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ printf "%s-db" $component | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        user: "{{ "{{" }} .username {{ "}}" }}"
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ $pg.usernameSecretName | quote }}
        decodingStrategy: {{ $decoding | quote }}
        conversionStrategy: Default
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: {{ $pg.passwordSecretName | quote }}
        decodingStrategy: {{ $decoding | quote }}
        conversionStrategy: Default
        metadataPolicy: None
{{- end }}
{{- end }}
