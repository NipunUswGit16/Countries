    - step: &sec
        name: Security Scan (gosec)
        script:
          - *configure-bitbucket-git-auth
          - export GOPRIVATE=bitbucket.org/ifs-pd
          - make sec
        caches:
          - gomodules
    - step: &codegen-validation
        name: Codegen Validation
        script:
          - *configure-bitbucket-git-auth
          - export GOPRIVATE=bitbucket.org/ifs-pd
          # jq + mikefarah/yq are required by make generate-openapi (invoked from make generate)
          - apt-get update && apt-get install -y --no-install-recommends jq curl ca-certificates
          - |
            YQ_VERSION=v4.53.2
            ARCH=$(dpkg --print-architecture)
            curl -sSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${ARCH}"
            chmod +x /usr/local/bin/yq
            yq --version
          - go mod download
          - make generate
          - |
            # Whole-tree porcelain check (not a path allowlist, not git diff):
            # make generate also runs go mod tidy and may write asyncapi, masterdata
            # entities, db-script-runner jobVersion, loaders, etc. Any modified,
            # staged, or untracked file means committed output is stale.
            GENERATED_CHANGES=$(git status --porcelain --untracked-files=all)
            if [ -z "$GENERATED_CHANGES" ]; then
              echo "✓ make generate produced no changes — generated files and go.mod/go.sum are up-to-date"
            else
              echo "✗ ERROR: make generate produced uncommitted changes!"
              echo ""
              echo "Generated outputs and/or go.mod/go.sum differ from committed versions."
              echo "Run 'make generate' locally, commit the result, and push."
              echo ""
              echo "Alternatively, ensure the pre-push hook is installed:"
              echo "  make install-hooks"
              echo ""
              printf '%s\n' "$GENERATED_CHANGES"
              git --no-pager diff -- || true
              exit 1
            fi
        caches:
          - gomodules
    - step: &lint
        name: Linter
        script:
          - *configure-bitbucket-git-auth
          - export GOPRIVATE=bitbucket.org/ifs-pd
          - go mod download
          - make lint
        artifacts:
          download: false
          upload:
            - name: "Lint Artifacts"
              type: shared
              paths:
                - "**/golangci-lint-report.xml"
        caches:
          - gomodules
          - golangci-lint
    - step: &unit-test
        name: Unit Tests
        script:
          - *configure-bitbucket-git-auth
          - export GOPRIVATE=bitbucket.org/ifs-pd
          - go mod download
          - make test-unit
        artifacts:
          download: false
          upload:
            - name: "Unit Test Artifacts"
              type: shared
              paths:
                - "**/govet-report.out"
                - "**/coverage-unit.out"
                - "**/report-unit.json"
                - "**/test-reports/report-unit.xml"
        caches:
          - gomodules
    - step: &functional-test
        name: Functional Tests
        script:
          - *configure-bitbucket-git-auth
          - export GOPRIVATE=bitbucket.org/ifs-pd
          - go mod download
          - make test-functional
        services:
          - docker
        artifacts:
          download: false
          upload:
            - name: "Functional Test Artifacts"
              type: shared
              paths:
                - "**/coverage-functional.out"
                - "**/report-functional.json"
                - "**/test-reports/report-functional.xml"
        caches:
          - gomodules
    - step: &check-local-dev-deps
        name: Check local-dev dependencies
        # Fails the build on dependency wiring that only resolves on a developer's
        # machine: out-of-repo go.mod `replace` directives and file:// Helm chart
        # deps.
        #
        # The checker lives in the shared toolkit and is fetched into a CLEAN
        # scratch module rather than located via `go list -m` against this repo:
        # a local replace pointing the toolkit (or any lib) at a sibling checkout
        # absent in CI — exactly what this step exists to catch — would otherwise
        # break `go mod download`/`go list` here before the check could run.
        # `go mod edit -json` is a purely textual read, so reading the pinned
        # toolkit version still works on those offending branches.
        script:
          - *configure-bitbucket-git-auth
          - export GOPRIVATE=bitbucket.org/ifs-pd
          - |
            set -euo pipefail
            TOOLKIT_MOD=bitbucket.org/ifs-pd/kairos-component-common/toolkit
            VER=$(go mod edit -json | grep -A1 "\"$TOOLKIT_MOD\"" | grep '"Version"' \
                  | head -1 | sed -E 's/.*"Version": "([^"]+)".*/\1/')
            if [ -z "$VER" ]; then
              echo "✗ could not determine $TOOLKIT_MOD version from go.mod" >&2
              exit 1
            fi
            SCRATCH=$(mktemp -d)
            ( cd "$SCRATCH" && go mod init check-bootstrap >/dev/null \
                && go get "${TOOLKIT_MOD}@${VER}" )
            TOOLKIT_DIR=$(cd "$SCRATCH" && go list -m -f '{{.Dir}}' "$TOOLKIT_MOD")
            bash "$TOOLKIT_DIR/scripts/check-local-dev-deps.sh" "$BITBUCKET_CLONE_DIR"
        caches:
          - gomodules
    - step: &trivy-scan
        name: Trivy Scan
        image: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
        artifacts:
          download: false
        script:
          - trivy --cache-dir .trivycache fs --no-progress --severity HIGH,CRITICAL --exit-code 1 ./
        caches:
          - trivy
    - step: &release-libraries
        name: Release libraries
        script:
          - *configure-bitbucket-git-auth
          - export GOPRIVATE=bitbucket.org/ifs-pd
          - go mod download
          - git config user.name "Renovate Bot <$KAIROS_RENOVATE_BITBUCKET_EMAIL>"
          - git config user.email "$KAIROS_RENOVATE_BITBUCKET_EMAIL"
          - |
            TOOLKIT_DIR=$(go list -m -f '{{.Dir}}' bitbucket.org/ifs-pd/kairos-component-common/toolkit)
            bash "$TOOLKIT_DIR/scripts/auto-release.sh"
        caches:
          - gomodules
clone:
  depth: full

pipelines:
  
  pull-requests:
    "**": # this trigger will make the pipeline run for all Pull Requests
      - parallel:
        - step: *codegen-validation
        - step: *check-local-dev-deps
        - step: *lint
        - step: *sec
        - step: *unit-test
        - step: *functional-test
        - step: *trivy-scan
    #  - parallel:
    #    - step: *sonarcloud-analysis
    #    - step: *vera-code-sca
    #    - step: *vera-code-pack
    #  - step: *vera-code-analysis

  branches:
    "main":
      - parallel:
        - step: *codegen-validation
        - step: *check-local-dev-deps
        - step: *lint
        - step: *sec
        - step: *unit-test
        - step: *functional-test
        - step: *trivy-scan
#      - parallel:
#        - step: *sonarcloud-analysis
#        - step: *vera-code-sca
#        - step: *vera-code-pack
#      - parallel:
#        - step: *vera-code-analysis
#        - step: *vera-code-app-scan
      - step: *release-libraries

  custom:
    rollout:
      import: kairos-component-rollout@nexus-ci
    hotfix-rollout:
      import: kairos-component-hotfix-rollout@nexus-ci
    preview:
      import: kairos-component-preview@nexus-ci
